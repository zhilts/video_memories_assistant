[tool.poetry]
name = "video-memories-assistant"
version = "0.1.0"
description = "CLI tool for analyzing video footage and extracting memory highlights"
authors = ["Sergey Zhiltsov <zhiltsov.s.i@gmail.com>"]
packages = [{ include = "video_memories_assistant" }]

[tool.poetry.dependencies]
python = "^3.10"
typer = { extras = ["all"], version = "^0.9.0" }
ffmpeg-python = "^0.2.0"
transformers = "^4.35.0"
torch = "^2.1.2"
torchvision = "^0.16.2"
pillow = "^10.0.0"

[tool.poetry.scripts]
video-memories = "video_memories_assistant.__main__:main"
